<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SOW</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #007bff;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #666;
            font-size: 1.2rem;
        }
        .emoji {
            font-size: 3rem;
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>SOW</h1>
        <p>Coucou c'est mon site web !</p>
        <span class="emoji">😁</span>
    </div>
</body>
</html>
