---
- name: Configuration des interfaces
  hosts: routeurs
  gather_facts: no

  tasks:
    # 1. Configuration des adresses IP (l3)
    - name: Configuration des adresses IP sur les interfaces
      cisco.ios.ios_config:
        config:
          - name: GigabitEthernet1
            ipv4:
              - address: dhcp
          - name: GigabitEthernet2
            ipv4:
              - address: 192.168.2.1/24
          - name: GigabitEthernet3
            ipv4:
              - address: 192.168.3.1/24
          - name: GigabitEthernet4
            ipv4:
              - address: 192.168.4.1/24
      

    # 2. Ajout des descriptions et activation (l2)
    - name: Activation et descriptions des interfaces
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: WAN_VBOX
            enabled: true
          - name: GigabitEthernet2
            description: LAN_ENTREPRISE
            enabled: true
          - name: GigabitEthernet3
            description: LAN_DMZ
            enabled: true
          - name: GigabitEthernet4
            description: LAN_ADMIN
            enabled: true
     