---
- name: Playbook TP Complet - Interfaces et DHCP
  hosts: routeurs
  gather_facts: no

  tasks:
    # --- PARTIE 1 : INTERFACES ---
    - name: Configuration IP GigabitEthernet2
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.2.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet2

    - name: Configuration IP GigabitEthernet3
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.3.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet3

    - name: Configuration IP GigabitEthernet4
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.4.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet4

    - name: Activation et descriptions des interfaces
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: WAN_VBOX
            enabled: true
          - name: GigabitEthernet2
            description: LAN_ENTREPRISE
            enabled: true
          - name: GigabitEthernet3
            description: LAN_DMZ
            enabled: true
          - name: GigabitEthernet4
            description: LAN_ADMIN
            enabled: true
        state: merged

    # --- PARTIE 2 : DHCP ---
    - name: Vérifier si le pool existe
      cisco.ios.ios_command:
        commands: "show ip dhcp pool POOL_LAN_ENTREPRISE"
      register: pool_check
      failed_when: false

    - name: Suppression de l'ancien pool DHCP
      cisco.ios.ios_config:
        lines:
          - no ip dhcp pool POOL_LAN_ENTREPRISE
      when: "'Pool POOL_LAN_ENTREPRISE' in pool_check.stdout[0]"

    - name: Création du nouveau pool DHCP
      cisco.ios.ios_config:
        lines:
          - network 192.168.2.0 255.255.255.0
          - default-router 192.168.2.1
          - dns-server 8.8.8.8
        parents: ip dhcp pool POOL_LAN_ENTREPRISE

    # --- PARTIE 3 : Configuration du NAT Dynamique (PAT) ---

    - name: Configuration de l'interface Outside (WAN)
      cisco.ios.ios_config:
        lines:
          - ip nat outside
        parents: interface GigabitEthernet1

    - name: Configuration des interfaces Inside (LAN)
      cisco.ios.ios_config:
        lines:
          - ip nat inside
        parents: "interface {{ item }}"
      loop:
        - GigabitEthernet2
        - GigabitEthernet3
        - GigabitEthernet4

    - name: Configuration de l'ACL et du NAT global
      cisco.ios.ios_config:
        lines:
          - access-list 10 permit 192.168.2.0 0.0.0.255
          - access-list 10 permit 192.168.3.0 0.0.0.255
          - access-list 10 permit 192.168.4.0 0.0.0.255
          - ip nat inside source list 10 interface GigabitEthernet1 overload

    # --- PARTIE 4 : NAT Statique (Port Forwarding / PAT) ---
    - name: Configuration du Port Forwarding (Web et SSH)
      cisco.ios.ios_config:
        lines:
          - "ip nat inside source static tcp {{ item.local_ip }} {{ item.local_port }} interface GigabitEthernet1 {{ item.ext_port }}"
      loop:
        - { local_ip: '192.168.3.2', local_port: '80',   ext_port: '80'   } # Serveur Web
        - { local_ip: '192.168.4.2', local_port: '22',   ext_port: '2222' } # Serveur SSH